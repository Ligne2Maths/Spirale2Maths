<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnet2Maths</title>
<meta name="description" content="Carnet2Maths — révisions vidéo de maths par Chapitre ou par Date." />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="site-header">
  <h1 class="site-title">📒 Carnet2Maths</h1>

  <div class="header-row" id="niveau-row" hidden>
    <span class="header-row-label">Niveau de classe</span>
    <span id="niveau-toggles" class="checkbox-group"></span>
  </div>

  <div class="header-row" id="mode-row">
    <span class="header-row-label">Affichage</span>
    <div class="segmented" id="mode-toggle">
      <span class="segment-indicator" id="mode-indicator"></span>
      <button type="button" class="segment-btn" data-mode="chapitre">Par Chapitre</button>
      <button type="button" class="segment-btn" data-mode="date">Par Date</button>
    </div>
  </div>
</header>

<main id="app">
  <p id="loading-message">Chargement…</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
